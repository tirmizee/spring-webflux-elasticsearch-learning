# Chapter 04 - local, single-node Elasticsearch with SECURITY ENABLED, for learning ONLY.
#
# Security is ON so API keys work. The HTTP layer is left on plain HTTP (no TLS) to keep the
# local setup reproducible without managing self-signed certificates.
#
# >>> PRODUCTION WARNING <<<
#   - In any real/shared environment you MUST enable TLS on the HTTP layer
#     (xpack.security.http.ssl.enabled=true) so the API key is never sent in clear.
#   - Never expose this node beyond localhost. The port is bound to 127.0.0.1 only.
services:
  elasticsearch:
    image: elasticsearch:9.4.8
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in your environment}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
